name: Documentation

# Construit la documentation Sphinx/autoapi et la publie sur GitHub Pages
# à chaque push sur main. Nécessite d'avoir activé, une seule fois, dans
# Settings > Pages > Source : "GitHub Actions" pour ce dépôt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances système
        run: |
          # graphviz : sphinx.ext.graphviz (diagrammes d'héritage autoapi).
          sudo apt-get update
          sudo apt-get install --yes graphviz

      - name: Installer Poetry et les dépendances du projet
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --verbose

      - name: Construire la documentation
        run: |
          cd docs
          poetry run make html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
