name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Poetry et les dépendances du projet
        run: |
          pip install --upgrade pip
          pip install poetry
          poetry install --with=dev --verbose

      - name: Tests
        run: poetry run pytest -q
